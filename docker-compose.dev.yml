services:
  app:
    container_name: leaf-api-dev
    ports:
      - "15870:8000"
    environment:
      - APP_ENV=development
      - NUM_THREADS=1
      - MAX_CONCURRENT_CLASSIFY=1
    # Measured: at 1g this container's memory.peak pegged at the limit even at
    # concurrency 1, so the kernel was evicting the mmap'd model pages and
    # re-reading them from disk on every inference. 1500m leaves real cache
    # headroom; the host has ~5.3 GB free, so there is nothing to save here.
    mem_limit: 1500m
    mem_reservation: 1g
    # Memory nearly matches prod, CPU does not — dev must lose the race.
    cpus: 0.5
