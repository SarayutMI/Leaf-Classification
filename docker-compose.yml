# Shared service definition. Always combine it with an environment file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# The published port lives in the override files only — declaring it here
# too would append a second mapping instead of replacing it.
services:

  app:
    build:
      context: .
      target: runtime
    image: "${REGISTRY}leaf-api:${TAG:-local}"
    env_file:
      - .env
    environment:
      # Fixed inside the container so the override files can map a stable
      # host port; PORT in .env is only meaningful when running locally
      # without compose.
      - PORT=8000
      - YOLO_CONFIG_DIR=/tmp
      - PYTHONUNBUFFERED=1
    # `host.docker.internal` is a Docker Desktop convenience that does not
    # exist on Linux, where DB_HOST pointing at it fails to resolve and the
    # startup seed aborts. host-gateway maps it to the host's bridge address so
    # the same DB_HOST works on both.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - model_leaf:/app/Model-Leaf
      - model_classification:/app/Model_Classification
      # Region crops when AWS_ALLOWED_UPLOADED=false. Without this they live in
      # the container layer and vanish on the next recreate.
      - uploads:/app/uploads
    # json-file with no cap grows until the disk fills. Two 10 MB files is
    # enough to debug a crash and bounded on a small shared VPS.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

    pids_limit: 256
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 900s   # first boot converts models (TFLite + OpenVINO) before serving
    restart: unless-stopped

volumes:
  model_leaf:
  model_classification:
  uploads:
